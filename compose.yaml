services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: kinovolna
      POSTGRES_USER: kinovolna
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - kinovolna_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kinovolna -d kinovolna"]
      interval: 5s
      timeout: 3s
      retries: 15
  migrate:
    build: .
    profiles: ["tools"]
    env_file: .env
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:?Set DOCKER_DATABASE_URL with hostname db in .env}
    command: ["node", "scripts/migrate.mjs"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DOCKER_DATABASE_URL:?Set DOCKER_DATABASE_URL with hostname db in .env}
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      db:
        condition: service_healthy
volumes:
  kinovolna_postgres:
